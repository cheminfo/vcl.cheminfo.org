<!doctype html>
<html lang="en">
  <head>
    <!-- Where this deployment is mounted. The build itself carries no mount —
         its assets are relative — so this is what resolves them, and what the
         page reads its own mount back off. The container rewrites it from
         BASE_PATH when it starts, which is how one image serves both this
         site's own host and a path of a shared one. It has to come before
         anything it resolves. -->
    <base href="/" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2d72d2" />
    <!-- Where the title, the description, the canonical address, the social
         card and the structured data are written, per address, by
         `cheminfoPrerender` from `src/state/routes.ts`. The template carries
         none of its own, so nothing here can be duplicated or taken back out. -->
    <!--cheminfo:head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Where the pages a reader with no JavaScript can follow are written: the
         body is an empty root element, so this is the only crawl path through
         the site that costs nothing to render. -->
    <!--cheminfo:body-->
  </body>
</html>

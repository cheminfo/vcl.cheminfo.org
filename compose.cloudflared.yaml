# Cloudflare Tunnel deployment — no port published on the host.
#
# Cloudflare dashboard (https://dash.cloudflare.com):
#   Networking → Tunnels → Create a tunnel → Cloudflared connector →
#   copy the token into .env as TUNNEL_TOKEN=... → open the tunnel →
#   Published applications tab → add application with
#   Service = HTTP, URL = vcl-cheminfo-org:10103 (the PORT of .env).
#
# Select via COMPOSE_FILE in .env (this file's name), then: docker compose up -d
services:
  vcl-cheminfo-org:
    # IMAGE_TAG is managed by the server's deploy script so every build stays addressable for
    # a rollback. Unset, this runs the released :latest image.
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/vcl.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    environment:
      SERVER_PORT: ${PORT:-10103}
      TRACKING_SCRIPT: ${TRACKING_SCRIPT:-}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    # The pages served are written here at startup, so the analytics snippet can
    # go in them while the image filesystem stays read-only.
    tmpfs:
      - /public:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'

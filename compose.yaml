# Port-published deployment — no reverse proxy.
# This is the default compose file (used when COMPOSE_FILE is unset).
# cp .env.example .env
# docker compose up -d
services:
  vcl-cheminfo-org:
    # IMAGE_TAG is managed by the server's deploy script so every build stays addressable for
    # a rollback. Unset, this runs the released :latest image.
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/vcl.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    environment:
      SERVER_PORT: ${PORT:-10103}
      TRACKING_SCRIPT: ${TRACKING_SCRIPT:-}
    ports:
      - '${PORT:-10103}:${PORT:-10103}'
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    # The pages served are written here at startup, so the analytics snippet can
    # go in them while the image filesystem stays read-only.
    tmpfs:
      - /public:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

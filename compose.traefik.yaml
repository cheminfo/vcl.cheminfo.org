# Traefik deployment — requires an external Docker network named "traefik".
# Select via COMPOSE_FILE in .env (this file's name), then: docker compose up -d
services:
  vcl-cheminfo-org:
    # IMAGE_TAG is managed by the server's deploy script so every build stays addressable for
    # a rollback. Unset, this runs the released :latest image.
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/vcl.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    # What the server's deploy script probes before it keeps a new container.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:10103/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      SERVER_PORT: ${PORT:-10103}
      BASE_PATH: ${BASE_PATH:-/}
      TRACKING_SCRIPT: ${TRACKING_SCRIPT:-}
    # Only the traefik network: a `default` alongside it would create a second,
    # unused subnet, and the host's pool is finite.
    networks:
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.vcl.rule=Host(`vcl.cheminfo.org`)'
      - 'traefik.http.routers.vcl.entrypoints=websecure'
      - 'traefik.http.routers.vcl.tls.certresolver=letsencrypt'
      - 'traefik.http.services.vcl.loadbalancer.server.port=${PORT:-10103}'
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    # The pages served are written here at startup, so the analytics snippet can
    # go in them while the image filesystem stays read-only.
    tmpfs:
      - /public:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

networks:
  traefik:
    external: true
